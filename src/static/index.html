<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stacks — Semantic PDF Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #20262e;
    --paper: #ece7da;
    --card: #fffdf9;
    --accent: #2f5d50;
    --accent-soft: #dce8e4;
    --highlight: #f6c453;
    --muted: #7a7566;
    --border: #d8d1bf;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .app-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 32px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sidebar-header {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    padding-left: 8px;
    margin-bottom: 8px;
  }
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 56px 24px 100px;
    width: 100%;
  }

  header {
    margin-bottom: 40px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 42px;
    margin: 0;
    line-height: 1.05;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-top: 10px;
    max-width: 46ch;
  }

  /* Upload strip */
  .upload-strip {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 28px;
  }

  .upload-strip label {
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .upload-strip label:hover { background: var(--accent); color: #fff; }
  .upload-strip input[type="file"] { display: none; }

  #upload-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Search bar */
  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 36px;
  }

  .search-bar input[type="text"] {
    flex: 1;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    padding: 14px 4px;
    border: none;
    border-bottom: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    outline: none;
  }
  .search-bar input[type="text"]::placeholder { color: #9a9484; }
  .search-bar input[type="text"]:focus { border-bottom-color: var(--accent); }

  .search-bar button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 22px;
    cursor: pointer;
  }
  .search-bar button:hover { background: var(--accent); }
  .search-bar button:focus-visible, .upload-strip label:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Results */
  #results-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .result-card {
    display: flex;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 20px 20px 0;
    margin-bottom: 16px;
  }

  .rank-tab {
    flex: 0 0 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 10px 0 0 10px;
    align-self: stretch;
  }

  .result-body { flex: 1; min-width: 0; }

  .result-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .result-meta .filename {
    color: var(--ink);
    font-weight: 500;
    font-family: 'Inter', sans-serif;
  }

  .score-badge {
    background: var(--accent);
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .excerpt {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
  }
  .excerpt .ellipsis { color: var(--muted); }

  .excerpt mark {
    background: transparent;
    color: var(--ink);
    padding: 0.05em 0.15em;
    position: relative;
  }
  .excerpt mark::before {
    content: "";
    position: absolute;
    left: -2px; right: -2px; top: 18%; bottom: 10%;
    background: var(--highlight);
    transform: rotate(-0.6deg);
    border-radius: 3px 6px 4px 7px;
    z-index: -1;
    mix-blend-mode: multiply;
  }

  .empty-state, .loading-state {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    padding: 24px 0;
  }

  .library {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .doc-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s, color 0.15s;
  }

  .doc-chip.active {
    background: var(--accent-soft);
    color: var(--ink);
    border-color: var(--border);
  }

  .doc-chip:hover:not(.active) {
    background: rgba(47, 93, 80, 0.05);
    color: var(--ink);
  }

  .doc-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: #a33;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    opacity: 0.5;
  }

  .delete-btn:hover {
    background: #fee;
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">Library</div>
      <div id="library" class="library"></div>
    </aside>
    
    <main class="main-content">
      <div class="wrap">
        <header>
          <div class="eyebrow">Semantic Search</div>
          <h1>Stacks</h1>
          <p class="subtitle">Search Engine through Meaning</p>
        </header>

        <div class="upload-strip">
          <label for="file-input">Choose PDF</label>
          <input type="file" id="file-input" accept="application/pdf" />
          <span id="upload-status">Upload Documents</span>
        </div>

        <div class="search-bar">
          <input type="text" id="query-input" placeholder="What are you looking for?" />
          <button id="search-btn">Search</button>
        </div>

        <div id="results-meta"></div>
        <div id="results"></div>
      </div>
    </main>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const uploadStatus = document.getElementById('upload-status');
    const queryInput = document.getElementById('query-input');
    const searchBtn = document.getElementById('search-btn');
    const resultsEl = document.getElementById('results');
    const resultsMetaEl = document.getElementById('results-meta');
    const libraryEl = document.getElementById('library');
  
    let activePdfId = null; // null = search across all documents
  
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
  
      uploadStatus.textContent = `Indexing ${file.name}...`;
      const formData = new FormData();
      formData.append('file', file);
  
      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        if (!res.ok) throw new Error(`Upload failed (${res.status})`);
        const data = await res.json();
        uploadStatus.textContent = `Indexed: ${data.filename} (${data.pdf_id.slice(0, 8)}…)`;
        loadDocuments();
      } catch (err) {
        uploadStatus.textContent = `Could not index this file — ${err.message}`;
      }
    });
  
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  
    function buildExcerpt(fullText, charStart, charEnd, windowSize = 100) {
      const start = Math.max(0, charStart - windowSize);
      const end = Math.min(fullText.length, charEnd + windowSize);
      const before = escapeHtml(fullText.slice(start, charStart));
      const marked = escapeHtml(fullText.slice(charStart, charEnd));
      const after = escapeHtml(fullText.slice(charEnd, end));
      const leadEllipsis = start > 0 ? '<span class="ellipsis">… </span>' : '';
      const trailEllipsis = end < fullText.length ? '<span class="ellipsis"> …</span>' : '';
      return `${leadEllipsis}${before}<mark>${marked}</mark>${after}${trailEllipsis}`;
    }
  
    async function loadDocuments() {
      try {
        const res = await fetch('/documents');
        const data = await res.json();
  
        if (data.documents.length === 0) {
          libraryEl.innerHTML = '';
          return;
        }
  
        const allChip = `<div class="doc-chip ${activePdfId === null ? 'active' : ''}" data-pdf-id="">
          <span class="doc-name">All documents</span>
        </div>`;
        const docChips = data.documents.map(doc => {
          let statusBadge = '';
          if (doc.status === 'PROCESSING') statusBadge = '<span style="color:var(--highlight);font-size:10px;white-space:nowrap;flex-shrink:0;">[PROCESSING]</span>';
          if (doc.status === 'FAILED') statusBadge = '<span style="color:#a33;font-size:10px;white-space:nowrap;flex-shrink:0;">[FAILED]</span>';
          if (doc.status === 'UPLOADED') statusBadge = '<span style="color:var(--muted);font-size:10px;white-space:nowrap;flex-shrink:0;">[QUEUED]</span>';
          if (doc.status === 'INDEXED') statusBadge = '<span style="color:var(--accent);font-size:10px;white-space:nowrap;flex-shrink:0;">[INDEXED]</span>';
          return `
          <div class="doc-chip ${activePdfId === doc.pdf_id ? 'active' : ''}" data-pdf-id="${doc.pdf_id}" title="${escapeHtml(doc.filename)}">
            <div style="display:flex; align-items:center; gap:8px; overflow:hidden; min-width:0; flex:1;">
              <span class="doc-name" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(doc.filename)}</span>
              ${statusBadge}
            </div>
            <button class="delete-btn" onclick="deleteDocument('${doc.pdf_id}', event)" title="Delete Document" style="flex-shrink:0; margin-left:4px;">×</button>
          </div>
        `}).join('');
  
        libraryEl.innerHTML = allChip + docChips;
  
        libraryEl.querySelectorAll('.doc-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            activePdfId = chip.dataset.pdfId || null;
            loadDocuments();
          });
        });
      } catch (err) {
        libraryEl.innerHTML = '';
      }
    }

    async function deleteDocument(pdfId, event) {
      event.stopPropagation();
      if (!confirm("Are you sure you want to delete this document?")) return;
      
      try {
        const res = await fetch(`/documents/${pdfId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error("Delete failed");
        
        if (activePdfId === pdfId) activePdfId = null;
        loadDocuments();
        
        // Refresh search if they are currently viewing results
        if (resultsEl.innerHTML !== '') {
          runSearch();
        }
      } catch (err) {
        alert("Error deleting document: " + err.message);
      }
    }
  
    async function runSearch() {
      const query = queryInput.value.trim();
      if (!query) return;
  
      resultsEl.innerHTML = '';
      resultsMetaEl.innerHTML = '<div class="loading-state">Searching…</div>';
  
      const params = new URLSearchParams({ query, top_k: 5 });
      if (activePdfId) params.set('pdf_id', activePdfId);
  
      try {
        const res = await fetch(`/search?${params}`);
        if (!res.ok) throw new Error(`Search failed (${res.status})`);
        const data = await res.json();
  
        resultsMetaEl.textContent = `${data.results.length} match(es) for "${data.query}"`;
  
        if (data.results.length === 0) {
          resultsEl.innerHTML = '<div class="empty-state">No matches. Try a different phrasing.</div>';
          return;
        }
  
        resultsEl.innerHTML = data.results.map((r, i) => `
          <div class="result-card">
            <div class="rank-tab">${String(i + 1).padStart(2, '0')}</div>
            <div class="result-body">
              <div class="result-meta">
                <span class="score-badge">${r.score.toFixed(3)}</span>
                <span class="filename">${escapeHtml(r.source_filename)}</span>
                <span>page ${r.page_number}</span>
              </div>
              <div class="excerpt">${buildExcerpt(r.full_page_text, r.char_start, r.char_end)}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        resultsMetaEl.innerHTML = '';
        resultsEl.innerHTML = `<div class="empty-state">Something went wrong — ${err.message}</div>`;
      }
    }
  
    searchBtn.addEventListener('click', runSearch);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runSearch();
    });
  
    loadDocuments();
  </script>
</body>
</html>
